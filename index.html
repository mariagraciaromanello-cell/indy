<!-- ============ PANTALLA DE BIENVENIDA ============ -->
<section id="welcome" class="welcome" aria-labelledby="welcome-title">
  <div class="welcome-bg" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="welcome-inner">
    <svg class="logo logo--light logo--xl" viewBox="0 0 176 60" role="img" aria-label="INDY"><use href="#logo-full"/></svg>
    <h1 id="welcome-title" data-brand="tagline">Cuidá a quien te acompaña.</h1>
    <p class="welcome-text" data-brand="intro">Todo lo que necesitás para cuidar, organizar y proteger a tu mascota, en un solo lugar.</p>
    <div class="welcome-actions">
      <button type="button" id="welcome-start" class="btn btn-accent btn-lg btn-block" data-action="start">COMENZAR</button>
      <button type="button" id="welcome-demo" class="btn btn-outline-light btn-block" data-action="demo" hidden>Probar con una mascota de ejemplo</button>
    </div>
    <p class="welcome-note">Gratis · Tus datos se guardan solo en este dispositivo</p>
  </div>
</section>

<!-- ============ APLICACIÓN ============ -->
<div id="app" class="app" hidden>

  <!-- Navegación: barra inferior en teléfono, barra lateral en escritorio -->
  <nav class="nav" id="nav" aria-label="Navegación principal">
    <div class="nav-brand"><svg class="logo" viewBox="0 0 176 60" role="img" aria-label="INDY"><use href="#logo-full"/></svg></div>
    <div class="nav-items">
      <button type="button" class="nav-btn" data-action="go" data-screen="home" data-tab="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Inicio</span></button>
      <button type="button" class="nav-btn" data-action="go" data-screen="pet" data-tab="pet"><svg class="icon" aria-hidden="true"><use href="#i-paw"/></svg><span>Mascota</span></button>
      <button type="button" class="nav-btn" data-action="go" data-screen="reminders" data-tab="reminders"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg><span>Recordatorios</span></button>
      <button type="button" class="nav-btn" data-action="go" data-screen="identity" data-tab="identity"><svg class="icon" aria-hidden="true"><use href="#i-idcard"/></svg><span>Identidad</span></button>
      <button type="button" class="nav-btn" data-action="go" data-screen="more" data-tab="more"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg><span>Más</span></button>
    </div>
    <p class="nav-tagline" data-brand="tagline">Cuidá a quien te acompaña.</p>
  </nav>

  <div class="main">
    <header class="appbar" id="appbar">
      <button type="button" class="icon-btn" id="appbar-back" data-action="back" aria-label="Volver" hidden><svg class="icon" aria-hidden="true"><use href="#i-back"/></svg></button>
      <div class="appbar-brand" id="appbar-brand"><svg class="logo" viewBox="0 0 176 60" role="img" aria-label="INDY"><use href="#logo-full"/></svg></div>
      <div class="appbar-title" id="appbar-title" hidden></div>
      <button type="button" class="lost-chip" id="appbar-lost" data-action="go" data-screen="identity" data-sub="lost" hidden><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg>PERDIDA</button>
    </header>

    <main id="content" class="content" tabindex="-1">
      <section class="screen" id="screen-home" hidden></section>
      <section class="screen" id="screen-pet" hidden></section>
      <section class="screen" id="screen-reminders" hidden></section>
      <section class="screen" id="screen-identity" hidden></section>
      <section class="screen" id="screen-more" hidden></section>
      <section class="screen" id="screen-moments" hidden></section>
      <section class="screen" id="screen-store" hidden></section>
      <section class="screen" id="screen-owner" hidden></section>
      <section class="screen" id="screen-settings" hidden></section>
      <section class="screen" id="screen-links" hidden></section>
      <section class="screen" id="screen-help" hidden></section>
      <section class="screen" id="screen-about" hidden></section>
    </main>
  </div>
</div>

<!-- Vista pública (identidad que ve quien encuentra a la mascota) -->
<div id="public-view" class="public-view" hidden></div>

<!-- Hojas de formulario / confirmaciones -->
<div id="sheet-root"></div>

<!-- Mensajes -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript><p style="padding:24px;font-family:sans-serif">INDY necesita JavaScript activado para funcionar.</p></noscript>
<script src="script.js"></script>
</body>
</html>
